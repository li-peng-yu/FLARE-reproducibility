# Representation ablation matched to the x5 Stage-1 scratch run.  The only
# algorithmic change is the bridge: canonical Cartesian CFM transports a
# standard Gaussian field to M_target along a raw affine path in R^{3N}.
output_dir: outputs/paper_experiments_20260813/stage1_cartesian_cfm50k
log_dir: logs/skx_paper_experiments_20260813/stage1_cartesian_cfm50k

bridge:
  state_repr: cart
  source_mode: latent
  objective: endpoint
  cart:
    normalize_path: false
    ignore_norm_factor: true

prior:
  type: standard_gaussian
  fit_kappa: false
  kappa_multiplier: 1.0
  kappa: 1.0
  min_sigma: 1.0e-4

train:
  visual_out_dir: outputs/paper_experiments_20260813/stage1_cartesian_cfm50k/visualizations
  visual_mode: trajectory
