# Deterministic FNO trained on the identical ring-holdout manifest used by the
# geometry-OOD SCFM model.
output_dir: outputs/paper_full_20260814/ood_ring_fno50k
log_dir: logs/skx_paper_full_20260814/ood_ring_fno50k

data:
  split_manifest: configs/data/ood_ring_split.json
  stats_cache: configs/stats/ood_ring_fno_stats.json
  zeeman_precondition:
    enabled: false

bridge:
  state_repr: cart
  source_mode: identity
  objective: residual
  cart:
    normalize_path: false
    ignore_norm_factor: true

prior:
  type: standard_gaussian
  fit_kappa: false
  kappa_multiplier: 1.0
  kappa: 1.0
  min_sigma: 1.0e-4

model:
  arch: fno
  fno:
    width: 96
    depth: 4
    modes: 20
    padding: 8

train:
  visual_out_dir: outputs/paper_full_20260814/ood_ring_fno50k/visualizations
  visual_mode: trajectory
  loss:
    tau_sampling: zero

sampler:
  ode_steps: 1
  method: euler
