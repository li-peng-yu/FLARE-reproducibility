# Compute-matched Stage-2 control: later segments use only frozen Stage-1
# predicted boundaries (first segments necessarily retain their real starts).
# This negative-control branch predates the final standard-prior Stage-2 pair;
# its matched Stage-1 teacher is released explicitly below.
output_dir: outputs/paper_experiments_20260813/stage2_pred_only25k
log_dir: logs/skx_paper_experiments_20260813/stage2_pred_only25k

train:
  steps: 25000
  resume_from: ${FLARE_CHECKPOINT_ROOT}/flare/legacy_physics_stage1_seed78.pt
  resume_model_state: ema
  resume_reset_step: true
  resume_strict: true
  lr: 1.0e-5
  dit_lr: 2.5e-6
  min_lr: 1.0e-7
  warmup_steps: 1000
  visual_out_dir: outputs/paper_experiments_20260813/stage2_pred_only25k/visualizations
  visual_mode: rollout
  segment_pushforward:
    enabled: true
    cache_mode: precompute
    cache_batch_size: 128
    cache_path: outputs/paper_experiments_20260813/stage2_pred_only25k/segment_handoff_cache
    rebuild_on_stage2_start: true
    teacher_checkpoint: ${FLARE_CHECKPOINT_ROOT}/flare/legacy_physics_stage1_seed78.pt
    teacher_state: ema
    predicted_inits_per_segment: 2
    candidate_inits_per_segment: 2
    true_weight: 0.0
    pred_weight: 1.0
    include_first_segment: true
    roll_ode_steps: 10
